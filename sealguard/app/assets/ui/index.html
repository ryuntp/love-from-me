<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SealGuard</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script type="module">
import { boot } from './boot.js';
import { nativeBridge } from './host.js';
import { createSimulator } from './sim.js';
import { loadConfig, saveConfig } from './config.js';

if (window.SealGuardHost) {
	boot(window, nativeBridge(window));
} else {
	const params = new URLSearchParams(window.location.search);
	const scenario = params.get('scenario') || 'night';
	const speed = Number(params.get('speed')) || 1;
	const theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
	// The sandbox is treated as already onboarded: the screenshot runner opens each route in a fresh profile and
	// expects that route, and #/onboarding still shows the flow on request.
	saveConfig(window.localStorage, Object.assign(loadConfig(window.localStorage), { onboarded: true }));
	document.documentElement.setAttribute('data-demo', '');
	const sim = createSimulator(scenario, 7, theme);
	boot(window, sim.bridge, sim.clock);
	sim.advanceBy(0);
	window.setInterval(function () { sim.advanceBy(1000 * speed); }, 1000);
}
</script>
</body>
</html>
